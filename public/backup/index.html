<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リアルタイムアンケート</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
:root{
  --primary:#0066cc;
  --bg:#f5f7fa;
}

body{
  margin:0;
  padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
}

h1{
  font-size:1.2rem;
  margin-bottom:8px;
}

h2{
  font-size:1rem;
  margin-bottom:16px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
  width:100%;
  min-height:56px;
  margin-bottom:12px;
  font-size:1rem;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
}

button:disabled{
  opacity:.5;
}

textarea{
  width:100%;
  height:120px;
  font-size:1rem;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

.message{
  text-align:center;
  font-size:1rem;
  padding:24px 0;
}

.result-item{
  font-size:.9rem;
  border-radius: 10px;/*角の丸み*/
  padding:6px 0;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<h1 id="title"></h1><a id="handoutLink" href="handoutURL" target="_blank" style="display:none">資料を開く</a>
<div id="msg"  class='message'>しばらくお待ちください</div>
<div id="pollArea" style="display:none">
  <h2 id="question"></h2>
  <div id="area" class="card"></div>
  <div id="result" class="card"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================
   ミーティングID取得
========================= */
const params = new URLSearchParams(location.search);
const meetingId = params.get("m");   // 例: index.html?m=abcd1234
let currentMeeting = null
if(!meetingId){
  document.body.innerHTML = "<div class='message'>ミーティングIDが指定されていません</div>";
  throw new Error("meetingId missing");
}

/* =========================
   Socket接続
========================= */
const socket = io({
  query:{
    role:"participant",
    meetingId: meetingId
  }
});

let currentPollId = "";
let voted = false;

/* =========================
   ミーティング情報受信
========================= */
socket.on("meeting", meeting=>{
  if(!meeting) return
  currentMeeting = meeting
  if(meeting.title){
    title.textContent = meeting.title;
  }

});

/* =========================
   アンケート表示
========================= */
socket.on("poll", ({ poll, options, answers})=>{
  if(!poll){
    msg.innerText = "しばらくお待ちください";
    pollArea.style.display = "none";
    return;
  }
  const isMultiAnswer = poll.multianswer == 1 
  question.textContent = poll.question || "";

  if(currentPollId !== poll.id || poll.status === "editing"){
    currentPollId = poll.id;
    voted = false; 
  }

    area.innerHTML = "";   
    result.innerHTML = "";
  if(voted){
    msg.innerText="送信ありがとうございました";
  }else{
    msg.innerText = "";
  }

  /* =========================
     最優先：休止・編集中
  ========================= */
  if(currentMeeting && currentMeeting.status === "close"){
    msg.innerText="この会議は終了しました";
    pollArea.style.display = "none"
    return
  }

  if(poll.status==="editing"){
    msg.innerText="しばらくお待ちください";
    pollArea.style.display = "none"
    return; // ← 他の描画を止めるのが重要
  }

  /* =========================
     停止中
  ========================= */
  if(poll.status==="stopping"){
     msg.innerText="回答は終了しました";
  }
  pollArea.style.display = "block";
  /* =========================
     投票UI
  ========================= */
  if(poll.status==="voting" && (!voted||isMultiAnswer)){

    /* =====================
      選択式
    ===================== */
    if(poll.type==="choice" && !voted){
      area.innerHTML = "";
      options.sort((a,b)=> a.ordernum - b.ordernum).forEach(o=>{
        if(isMultiAnswer){
          const l=document.createElement("label");
          l.style.display = "block";
          l.style.marginBottom = "8px";
          l.innerHTML = `<input type="checkbox" name="ans" value="${o.id}">${o.text}`
          area.appendChild(l);
        }else{
          const b=document.createElement("button");
          b.textContent=o.text;
          b.onclick=()=>{ 
            socket.emit("vote",o.id);
            voted=true; 
            area.innerHTML = "" 
            msg.innerText="送信ありがとうございました"; 
          };
          area.appendChild(b);
        }
      });
      if(isMultiAnswer){
        const b=document.createElement("button");
        b.textContent="回答する";
        b.onclick = ()=>{
          const selected = [...document.querySelectorAll("input[name='ans']:checked")].map(el=>el.value);
          if(selected.length===0) return;
          socket.emit("voteMulti", selected);
          voted=true;
          msg.innerText="送信ありがとうございました";
          area.innerHTML = ""
        }
        area.appendChild(b);
      }
    };
    

    /* =====================
      自由記載
    ===================== */
    if(poll.type==="text"){

      area.innerHTML=`
        <textarea id="messageArea" placeholder="こちらに入力してください"></textarea>
        <button id="sendBtn">送信</button>
      `;

      document.getElementById("sendBtn").onclick=()=>{
        const text = messageArea.value.trim();
        if(!text) return;

        socket.emit("submitText", text);
        messageArea.value="";
        
        voted=true;
        msg.innerText="送信ありがとうございました";
        if(!isMultiAnswer) area.innerHTML="";
      };
    }
  }

  /* =========================
     結果表示（投票中/停止中）
  ========================= */
  if((poll.status==="voting" || poll.status==="stopping") && poll.visible===1){

    if(poll.type==="choice"){
      options.forEach(o=>{
        result.innerHTML+=`<div class="result-item">${o.text}：${o.votes}</div>`;
      });
    }

    if(poll.type==="text"){
      answers.filter(a=>a.visible===1).reverse().forEach(a=>{
        result.innerHTML+=`<div class="result-item card">${a.text}</div>`;
      });
    }
  }
});

/* =========================
   設定受信（イベント名修正）
========================= */
socket.on("settings", rows=>{
  const settings = {};
  rows.forEach(r=> settings[r.setting_item] = r.setting);

  if(settings.background) applyBackground(settings.background);
  if(settings.handout) applyHandout(settings.handout);
});

function applyBackground(value){
  if(!value) return;

  document.body.style.background = value;

  // 画像系だった場合の補助指定
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundRepeat = "no-repeat";
  document.body.style.backgroundAttachment = "fixed";
}
function applyHandout(value){
  if(value){
    handoutLink.setAttribute('href', value);
    handoutLink.style.display = "block"
  }else{
    handoutLink.setAttribute('href', '');
    handoutLink.style.display = "none"
  }
}


/* =========================
   エラー処理
========================= */
socket.on("invalidMeeting", ()=>{
  document.body.innerHTML="<div class='message'>このミーティングは存在しません</div>";
});

</script>


</body>
</html>
