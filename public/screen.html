<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>投影画面</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screen.css">
</head>
<body>

<div class="wrapper">
  <div id="title"></div>
  <div id="question">しばらくお待ち下さい</div>
  <div id="status"></div>
  <div id="result"></div>
</div>

<script src="/js/resultDisplay.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================
   meetingId をURLから取得
========================= */
const params = new URLSearchParams(location.search);
const meetingId = params.get("m");   // 例: screen.html?m=abcd1234
let answersData = {}
let optionsData = {}
let lastRenderKey = "";

if(!meetingId){
  document.body.innerHTML = "<h1>meetingId が指定されていません</h1>";
  throw new Error("meetingId missing");
}

/* =========================
   Socket接続（重要修正）
========================= */
const socket = io({ query:{ role:"screen", meetingId } });

const titleEl = document.getElementById("title");
const questionEl = document.getElementById("question");
const statusEl = document.getElementById("status");
const statusText = {
  editing:"",
  voting:"🟢 回答受付中",
  stopping:"🟡 回答終了"
};

/* =========================
   会議タイトル受信
========================= */
socket.on("meeting", meeting=>{
  titleEl.textContent = meeting.title || "";
});

/* =========================
   設定受信（イベント名修正）
========================= */
socket.on("settings", rows=>{
  const settings = {};
  rows.forEach(r=> settings[r.setting_item] = r.setting);
  if(settings.background)
    applyBackground(settings.background);
});

/* =========================
   投票表示
========================= */
socket.on("poll", ({ poll, options=[], answers=[],times })=>{
  questionEl.textContent =
    (poll.status==="voting" || poll.status==="stopping")
      ? poll.question
      : "しばらくお待ち下さい";


  statusEl.textContent = statusText[poll.status] || "";
  let renderKey
  if(poll.type === "choice"){
    renderKey =`${poll.id}|${poll.status}|${poll.settings}|${poll.visible}|${options.map(o=>o.votes).join(",")}`
  }else if(poll.type === "time"){
    renderKey =`${poll.id}|${poll.status}|${poll.settings}|${poll.visible}|${times.map(o=>o.count).join(",")}`
  }else if(poll.type === "text"){
    renderKey =`${poll.id}|${poll.status}|${poll.settings}|${poll.visible}|${answers.filter(a=>a.visible).map(a=>a.id).join(",")}`;
  }else{
    renderKey =`${poll.id}|${poll.status}|${poll.settings}|${poll.visible}}`;
  }

  if (renderKey === lastRenderKey) return;
  lastRenderKey = renderKey;
  
  resultRender(poll, options, answers, times)
});



function applyBackground(value){
  if(!value) return;

  document.body.style.background = value;

  // 画像系だった場合の補助指定
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundRepeat = "no-repeat";
  document.body.style.backgroundAttachment = "fixed";
}

</script>

</body>
</html>
